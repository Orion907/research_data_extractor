# pytest.ini - Configuration for E2E testing of refactored Streamlit app

[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=3
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for organizing E2E tests
markers =
    e2e: End-to-end integration tests for the modular architecture
    workflow: UI workflow and user interaction tests
    browser: Browser-based tests using Selenium WebDriver
    performance: Performance and resource usage tests
    integration: Module integration and component tests
    slow: Marks tests as slow (deselect with '-m "not slow"')
    unit: Fast unit tests
    
# Timeout settings
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:.*streamlit.*:UserWarning

# Test discovery
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    htmlcov
    data/output/*
    .env
    venv
    env

# Coverage configuration (if pytest-cov is installed)
# addopts = --cov-config=.coveragerc